<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Gowtham D</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="scroll-progress-bar"></div>
  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>
  <div id="mouse-spotlight"></div>

  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <nav>
    <a href="index.html" class="logo">Gowtham D</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <div class="container">
        <h2 class="section-title" data-aos="fade-down" style="justify-content: center;"><i class="fa-solid fa-paper-plane"></i> Get In Touch</h2>

        <div class="grid-2">

          <!-- Contact Cards -->
          <div class="contact-grid" data-aos="fade-right">
            <div class="card contact-card">
              <i class="fa-solid fa-phone"></i>
              <h4>Phone</h4>
              <p>+91 9487517657</p>
            </div>

            <div class="card contact-card">
              <i class="fa-solid fa-envelope"></i>
              <h4>Email</h4>
              <a href="mailto:gowthamd2006@gmail.com">gowthamd2006@gmail.com</a>
            </div>

            <div class="card contact-card">
              <i class="fa-brands fa-linkedin"></i>
              <h4>LinkedIn</h4>
              <a href="https://www.linkedin.com/in/gowtham-dhanasekaran" target="_blank">
                View Profile
              </a>
            </div>
            <div class="card contact-card">
              <i class="fa-solid fa-location-dot"></i>
              <h4>Location</h4>
              <p>Komarapalayam, Tamil Nadu</p>
            </div>
          </div>

          <!-- Professional Interactive Form -->
          <div class="card" data-aos="fade-left">
            <form class="contact-form" action="https://formspree.io/f/your_form_id" method="POST">
              <div class="form-group">
                <input type="text" name="name" placeholder="Your Name" required>
              </div>
              <div class="form-group">
                <input type="email" name="email" placeholder="Your Email" required>
              </div>
              <div class="form-group">
                <textarea name="message" rows="5" placeholder="Your Message..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
            </form>
          </div>

        </div>
      </div>
    </section>
  </main>

  <button id="backToTop" aria-label="Back to Top"><i class="fa-solid fa-arrow-up"></i></button>

  <footer>
    <p>© 2026 Gowtham D. Designed with passion for Mechatronics & Design.</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
